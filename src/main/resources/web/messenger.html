<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Messagerie · ChatFlow</title>
  <link rel="stylesheet" href="chatflow.css">
  <script src="messenger.js" defer></script>
</head>
<body>
  <main class="messenger-window">
    <header class="flex h-[60px] shrink-0 items-center gap-[11px] bg-ink px-4 text-white">
      <img src="chatflow-messenger.svg" alt="" width="33.28" height="27.04">
      <span class="text-xl font-bold">ChatFlow</span>
      <div class="ml-auto flex min-w-0 items-center gap-[9px]">
        <span id="account-avatar" class="avatar h-8 w-8" aria-hidden="true"></span>
        <div class="min-w-0">
          <p class="truncate text-[13px] font-semibold" id="account-name"></p>
          <p class="truncate text-[11px] text-lavender" id="account-detail"></p>
        </div>
      </div>
      <button class="ml-3 shrink-0 rounded-md px-2 py-1 text-xs text-lavender hover:bg-white/10" id="logout" type="button">Se déconnecter</button>
    </header>
    <div class="flex min-h-0 flex-1">
      <aside class="messenger-sidebar" aria-label="Conversations">
        <h1 class="text-[22px] font-bold leading-tight">Conversations</h1>
        <form id="search-form" role="search" class="flex h-10 shrink-0 items-center gap-2 rounded-lg bg-canvas px-3">
          <button class="text-lg font-semibold text-action" type="submit" aria-label="Rechercher">⌕</button>
          <input id="search" class="w-full min-w-0 bg-transparent text-[13px] placeholder:text-muted" type="search" aria-label="Rechercher un contact" placeholder="Rechercher un contact">
        </form>
        <div class="min-h-0 flex-1 overflow-y-auto p-0.5">
          <ul id="conversations" class="flex flex-col gap-[5px]"></ul>
          <section id="people" hidden>
            <div class="mb-2 flex items-center justify-between gap-2">
              <h2 class="text-sm font-semibold">Recherche</h2>
              <button class="text-xs font-semibold text-action" id="clear-search" type="button">Retour à la liste</button>
            </div>
            <ul id="search-results"></ul>
          </section>
          <details class="mt-3 text-[13px]">
            <summary class="cursor-pointer rounded-md py-2 font-semibold text-muted">Contacts et demandes</summary>
            <h2 class="mt-2 font-semibold">Contacts</h2>
            <ul id="friends"></ul>
            <h2 class="mt-2 font-semibold">Demandes reçues</h2>
            <ul id="requests"></ul>
          </details>
        </div>
        <p id="status" class="max-h-20 overflow-auto break-words text-xs text-muted" role="status" hidden></p>
      </aside>
      <section class="flex min-w-0 flex-1 flex-col bg-canvas" aria-label="Discussion">
        <header class="flex h-[68px] shrink-0 items-center gap-3 border-b border-line bg-white px-5">
          <span id="contact-avatar" class="avatar h-9 w-9" aria-hidden="true" hidden></span>
          <div class="min-w-0">
            <h2 id="contact-name" class="truncate text-base font-semibold">Sélectionnez une conversation</h2>
            <p id="contact-detail" class="truncate text-[11px] text-muted"></p>
          </div>
        </header>
        <div id="history" class="min-h-0 flex-1 overflow-y-auto px-5 py-5" aria-label="Historique des messages" tabindex="0">
          <div id="messages" class="flex flex-col gap-3"></div>
        </div>
        <form id="composer" class="flex h-[65px] shrink-0 items-center gap-2.5 border-t border-line bg-white px-4">
          <input id="message" class="h-[38px] min-w-0 flex-1 rounded-lg border border-line bg-canvas px-3 text-[13px] placeholder:text-muted" aria-label="Écrire un message" placeholder="Écrire un message…" maxlength="4000" disabled>
          <button id="send" class="primary h-[38px] w-[103px] shrink-0 text-[13px]" type="submit" disabled>Envoyer&nbsp; ↗</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
