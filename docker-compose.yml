services:
  postgres:
    image: postgres:15
    container_name: chaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chatflow_db}
    ports:
      # Host port 5433 avoids colliding with an existing local/Docker PostgreSQL on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - chaflow-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  chaflow-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chaflow-socket-server
    ports:
      - "5050:5050"
    environment:
      CHAFLOW_PORT: "5050"
      CHAFLOW_DATA_DIR: /app/data
    volumes:
      - chaflow-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5050"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  chaflow-frontend:
    # JavaFX 21.0.6 has no Linux ARM64 artifacts in Maven Central.
    # Docker Desktop runs this image through emulation on Apple Silicon.
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      CHAFLOW_HOST: chaflow-server
      CHAFLOW_PORT: "5050"
    depends_on:
      chaflow-server:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1:6080/vnc.html"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s




volumes:
  chaflow-postgres-data:
  chaflow-server-data:
  chaflow-data:
    name: chaflow-data