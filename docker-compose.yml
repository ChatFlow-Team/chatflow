services:
  postgres:
    image: postgres:15
    container_name: chaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chatflow_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - chaflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  chaflow-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaflow-socket-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAFLOW_PORT: "5050"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chatflow_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chatflow_dev_password}
      CHAFLOW_STORAGE_ROOT: /app/storage
    ports:
      - "5050:5050"
    volumes:
      - chaflow-storage:/app/storage
    restart: unless-stopped

volumes:
  chaflow-postgres-data:
    name: chaflow-postgres-data
  chaflow-storage:
    name: chaflow-storage
